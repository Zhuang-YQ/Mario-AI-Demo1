<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>超级玛丽 · 简易版</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: linear-gradient(180deg, #eef4fb 0%, #dde8f4 100%);
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    color: #333;
  }
  h1 { font-size: 18px; font-weight: 600; margin: 0; color: #3a4a5e; letter-spacing: 1px; }
  canvas {
    background: #7ec8f5;
    border-radius: 10px;
    box-shadow: 0 12px 30px rgba(60, 90, 130, .25);
    display: block;
    max-width: 96vw;
  }
  .tip { font-size: 13px; color: #6b7c90; }
  kbd {
    display: inline-block;
    padding: 2px 7px;
    border-radius: 5px;
    background: #fff;
    border: 1px solid #c9d6e4;
    border-bottom-width: 2px;
    font-family: inherit;
    font-size: 12px;
    color: #3a4a5e;
  }
</style>
</head>
<body>

  <h1>超级玛丽 · 简易版</h1>
  <canvas id="game" width="800" height="400"></canvas>
  <div class="tip">
    <kbd>←</kbd> <kbd>→</kbd> 左右移动　|　<kbd>空格</kbd> 或 <kbd>↑</kbd> 跳跃
  </div>

<script>
/* ==========================================================
   1. 准备工作：拿到画布和画笔
   ========================================================== */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

const W = canvas.width;          // 画布宽 800
const H = canvas.height;         // 画布高 400
const GROUND_Y = H - 50;         // 地面高度：从顶部往下 350 像素处
const GRAVITY = 0.7;             // 重力：每帧往下拉的速度（数字越大掉得越快）

/* ==========================================================
   2. 主角：就是一个红色方块
   ========================================================== */
const player = {
  x: 100,             // 横向位置
  y: GROUND_Y - 44,   // 纵向位置（先让它站在地面上）
  w: 32,              // 宽
  h: 44,              // 高
  vx: 0,              // 横向速度
  vy: 0,              // 纵向速度
  speed: 4,           // 左右移动速度
  jumpPower: -14,     // 跳跃初速度（负数 = 向上）
  onGround: false     // 是否站在地面上
};

/* ==========================================================
   3. 几个可以跳上去的砖块（不想要的话，把数组清空即可）
   ========================================================== */
const blocks = [
  { x: 300, y: GROUND_Y - 90,  w: 90, h: 20 },
  { x: 470, y: GROUND_Y - 170, w: 90, h: 20 },
  { x: 640, y: GROUND_Y - 90,  w: 90, h: 20 }
];

/* 背景里的云朵（纯装饰，不影响玩法） */
const clouds = [
  { x: 120, y: 70,  s: 1.0 },
  { x: 460, y: 50,  s: 1.3 },
  { x: 700, y: 95,  s: 0.8 }
];

/* ==========================================================
   4. 键盘监听：记录哪些键正被按住
   ========================================================== */
const keys = {};
const BLOCK_KEYS = ['ArrowLeft', 'ArrowRight', 'ArrowUp', 'Space'];

document.addEventListener('keydown', function (e) {
  keys[e.code] = true;
  if (BLOCK_KEYS.indexOf(e.code) !== -1) e.preventDefault(); // 防止方向键滚动页面
});
document.addEventListener('keyup', function (e) {
  keys[e.code] = false;
});

/* ==========================================================
   5. 每帧更新一次游戏状态
   ========================================================== */
function update() {
  // ---- 读取键盘：决定横向速度 ----
  const goLeft  = keys['ArrowLeft']  || keys['KeyA'];
  const goRight = keys['ArrowRight'] || keys['KeyD'];
  const jumpKey = keys['Space'] || keys['ArrowUp'] || keys['KeyW'];

  player.vx = 0;
  if (goLeft)  player.vx = -player.speed;
  if (goRight) player.vx =  player.speed;

  // ---- 跳跃：只有站在地面上才能起跳 ----
  if (jumpKey && player.onGround) {
    player.vy = player.jumpPower;
    player.onGround = false;
  }

  // ---- 重力：让纵向速度不断变大（往下掉）----
  player.vy += GRAVITY;
  if (player.vy > 20) player.vy = 20;   // 限制下落速度，避免穿墙

  // ---- 先处理横向移动和横向碰撞 ----
  player.x += player.vx;
  if (player.x < 0) player.x = 0;                       // 左墙
  if (player.x + player.w > W) player.x = W - player.w; // 右墙
  for (let i = 0; i < blocks.length; i++) {
    if (hit(player, blocks[i])) {
      if (player.vx > 0)      player.x = blocks[i].x - player.w;      // 从左边撞上
      else if (player.vx < 0) player.x = blocks[i].x + blocks[i].w;   // 从右边撞上
    }
  }

  // ---- 再处理纵向移动和纵向碰撞 ----
  player.y += player.vy;
  player.onGround = false;
  for (let i = 0; i < blocks.length; i++) {
    if (hit(player, blocks[i])) {
      if (player.vy > 0) {          // 从上方落下来，站在砖块上
        player.y = blocks[i].y - player.h;
        player.vy = 0;
        player.onGround = true;
      } else if (player.vy < 0) {   // 从下方顶到砖块
        player.y = blocks[i].y + blocks[i].h;
        player.vy = 0;
      }
    }
  }

  // ---- 地面：永远踩得住 ----
  if (player.y + player.h >= GROUND_Y) {
    player.y = GROUND_Y - player.h;
    player.vy = 0;
    player.onGround = true;
  }
}

/* 两个矩形是否重叠（碰撞检测） */
function hit(a, b) {
  return a.x < b.x + b.w &&
         a.x + a.w > b.x &&
         a.y < b.y + b.h &&
         a.y + a.h > b.y;
}

/* ==========================================================
   6. 把当前状态画到画布上
   ========================================================== */
function draw() {
  // 天空
  ctx.fillStyle = '#7ec8f5';
  ctx.fillRect(0, 0, W, H);

  // 云朵
  ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
  for (let i = 0; i < clouds.length; i++) {
    const c = clouds[i];
    ctx.beginPath();
    ctx.arc(c.x,          c.y,          22 * c.s, 0, Math.PI * 2);
    ctx.arc(c.x + 26 * c.s, c.y - 10 * c.s, 28 * c.s, 0, Math.PI * 2);
    ctx.arc(c.x + 58 * c.s, c.y,          20 * c.s, 0, Math.PI * 2);
    ctx.fill();
  }

  // 地面：草地 + 泥土
  ctx.fillStyle = '#5fb85f';
  ctx.fillRect(0, GROUND_Y, W, 12);
  ctx.fillStyle = '#a9744f';
  ctx.fillRect(0, GROUND_Y + 12, W, H - GROUND_Y - 12);

  // 砖块
  for (let i = 0; i < blocks.length; i++) {
    const b = blocks[i];
    ctx.fillStyle = '#c8703c';
    ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.fillStyle = '#e08b52';
    ctx.fillRect(b.x, b.y, b.w, 5);
  }

  // 主角：红色方块（加两只眼睛，看起来像个小人）
  ctx.fillStyle = '#e03131';
  ctx.fillRect(player.x, player.y, player.w, player.h);
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(player.x + 7,  player.y + 10, 6, 7);
  ctx.fillRect(player.x + 19, player.y + 10, 6, 7);
  ctx.fillStyle = '#000000';
  ctx.fillRect(player.x + 9,  player.y + 12, 3, 4);
  ctx.fillRect(player.x + 21, player.y + 12, 3, 4);
}

/* ==========================================================
   7. 游戏主循环：一秒钟反复跑 60 次「更新 → 绘制」
   ========================================================== */
function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>

</body>
</html>
